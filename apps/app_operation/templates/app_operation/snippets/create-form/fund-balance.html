{% load i18n %}
{% if fund_entity %}
  <div class="alert alert-light border d-flex align-items-center mb-4 py-2">
    <i class="bi bi-wallet2 h4 mb-0 me-3 text-{{ fund_color|default:'primary' }}"></i>
    <div>
      <small class="text-muted d-block text-uppercase fw-bold" style="font-size: 0.65rem">
        {% if fund_label %}{{ fund_label }}{% else %}{% trans "Current Fund" %}{% endif %}
        {% if fund_entity.name %}<span class="text-dark">· {{ fund_entity.name }}</span>{% endif %}
      </small>
      <span class="fw-bold fs-5">{{ fund_currency|default:'$' }}{{ fund_entity.balance|floatformat:2 }}</span>
    </div>
  </div>
{% endif %}
